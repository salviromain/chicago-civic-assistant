# Dependabot (Day 14 security pass): weekly pull requests when a dependency has a newer
# version, and right away for a known vulnerability. Each one runs CI (tests + live eval).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
