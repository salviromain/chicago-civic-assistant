# Dependabot (Day 14 security pass): weekly pull requests when a dependency has a newer
# version, and right away for a known vulnerability. Each one runs CI (tests + live eval).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    # A new Python version for the image (3.12 -> 3.15) is a deliberate, tested change:
    # CI runs on 3.12 and doesn't build the image. Patch and security updates still come.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
