name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # "Run workflow" button in the Actions tab

# The workflow's GitHub token can read the code and nothing else. Actions are pinned
# to commit ids (a tag like v7 can be moved to other code; a commit id can't).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # A small live eval on every pull request (Day 13): 10 questions across the three
  # routes, the main data traps and two refusals, against the Neon database as
  # civic_reader. No judge; about 25 Gemini calls on the paid key (~$0.04 a run; the
  # free tier timed out too often). Fails if answer checks or refusals drop below 80%,
  # or a question errors twice.
  eval:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      READONLY_DATABASE_URL: ${{ secrets.READONLY_DATABASE_URL }}
      LLM_REQUESTS_PER_MINUTE: "60"  # paid tier: no need for the free tier's 8 a minute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Skip without secrets
        if: env.GEMINI_API_KEY == '' || env.READONLY_DATABASE_URL == ''
        run: echo "::warning::GEMINI_API_KEY or READONLY_DATABASE_URL is not set; eval skipped"
      - name: Eval subset
        if: env.GEMINI_API_KEY != '' && env.READONLY_DATABASE_URL != ''
        run: >
          python -m evals.run_evals --label ci --no-judge --fail-under 0.8
          --ids q005,q014,q021,q037,q038,q063,q070,q078,q081,q084
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-ci
          path: evals/results/ci*
          if-no-files-found: ignore
